<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hotel Booking - find and book rooms at the best hotels near you."
    />
    <title>Hotel Booking</title>

    <!-- Tailwind Play CDN: compiles utility classes at runtime (no build step) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0fdfa',
                100: '#ccfbf1',
                200: '#99f6e4',
                300: '#5eead4',
                400: '#2dd4bf',
                500: '#14b8a6',
                600: '#0d9488',
                700: '#0f766e',
                800: '#115e59',
                900: '#134e4a',
              },
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- NOTE: Vite uses the index.html at the project ROOT as the dev entry.
         This file is kept so the public/ folder matches the project structure. -->
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
